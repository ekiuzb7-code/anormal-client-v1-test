name: Build Minecraft Client JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Uses the project's Gradle wrapper (see gradle/wrapper/gradle-wrapper.properties),
      # which pins a Gradle version compatible with Fabric Loom 1.14.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod JAR
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnormalClient-1.21.11
          # Only the runnable, remapped mod jar - not the -dev / -sources jars.
          path: |
            build/libs/AnormalClient-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
