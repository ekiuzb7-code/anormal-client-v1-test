plugins {
    id 'fabric-loom' version '1.17.16'
    id 'maven-publish'
}

version = property('mod_version')
group = property('maven_group')

base {
    archivesName = property('archives_base_name')
}

loom {
    accessWidenerPath = file("src/main/resources/lucidclient.accesswidener")
}

repositories {
    // Add repositories to retrieve artifacts from here.
    // Loom adds the essential maven repositories automatically.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    mappings "net.fabricmc:yarn:${property('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    // Minecraft 1.21 uses Java 21
}

java {
    // Generate sources and javadoc jars for nicer debugging
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // Explicitly disable the reproducible build flag issues by including manifest
    manifest {
        attributes(
            'Specification-Title': 'Lucid Client',
            'Specification-Version': project.version,
            'Implementation-Title': 'Lucid Client',
            'Implementation-Version': project.version
        )
    }
}
